apiVersion: apps/v1
kind: Deployment
metadata:
  name: statussphere-backend
  namespace: statussphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: statussphere-backend
  template:
    metadata:
      labels:
        app: statussphere-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/shreeyasahai/status-sphere-platform-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: statussphere-db-credentials
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: statussphere
spec:
  selector:
    app: statussphere-backend
  ports:
    - port: 8000
      targetPort: 8000