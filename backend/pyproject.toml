[project]
name = "statussphere-backend"
version = "0.1.0"
description = "Cloud-Native Application Health & Reliability Platform"
readme = "README.md"
requires-python = ">=3.14"

authors = [
    { name = "Shreeya Sahai" }
]

dependencies = [
    # Web Framework
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.37.0",

    # Database
    "sqlalchemy>=2.0.43",
    "alembic>=1.16.5",
    "psycopg[binary]>=3.2.10",

    # Validation & Configuration
    "pydantic>=2.11.9",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.1.1",

    # HTTP Client
    "httpx>=0.28.1",

    # Scheduler
    "apscheduler>=3.11.0",

    # Logging
    "structlog>=25.4.0",

    # Metrics
    "prometheus-client>=0.23.1",
]

[dependency-groups]
dev = [
    # Testing
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",

    # Linting & Formatting
    "ruff>=0.13.0",

    # Git Hooks
    "pre-commit>=4.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"