apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: statussphere
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: {{ .Values.backend.port }}
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: {{ .Values.backend.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: statussphere-frontend
                port:
                  number: {{ .Values.frontend.port }}