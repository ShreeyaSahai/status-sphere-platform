services:
  postgres:
    image: postgres:17
    container_name: statussphere-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: statussphere
      POSTGRES_USER: statussphere
      POSTGRES_PASSWORD: statussphere

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statussphere -d statussphere"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: statussphere-backend
    restart: unless-stopped

    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: statussphere
      DATABASE_USER: statussphere
      DATABASE_PASSWORD: statussphere

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    
    container_name: statussphere-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  postgres_data: