name: Docker

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-and-push-backend:
    name: Build, Scan and Push Backend
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker buildx build \
            --load \
            --provenance=false \
            --sbom=false \
            -t statussphere-backend:${{ github.sha }} \
            ./backend
      
      - name: Debug - Trivy help for SBOM/referrer options
        run: |
          docker run --rm aquasec/trivy:0.70.0 image --help | grep -i -A 2 'sbom\|referrer\|attest'

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: statussphere-backend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
        env:
          TRIVY_DISABLE_SBOM: "true"

      - name: Generate Trivy SARIF for backend
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: statussphere-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
        env:
          TRIVY_DISABLE_SBOM: "true"

      - name: Upload backend SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Push backend image
        run: |
          docker tag statussphere-backend:${{ github.sha }} \
            ghcr.io/shreeyasahai/status-sphere-platform-backend:latest

          docker tag statussphere-backend:${{ github.sha }} \
            ghcr.io/shreeyasahai/status-sphere-platform-backend:${{ github.sha }}

          docker push ghcr.io/shreeyasahai/status-sphere-platform-backend:latest
          docker push ghcr.io/shreeyasahai/status-sphere-platform-backend:${{ github.sha }}

  build-and-push-frontend:
    name: Build, Scan and Push Frontend
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image
        run: |
          docker buildx build \
            --load \
            --provenance=false \
            --sbom=false \
            -t statussphere-frontend:${{ github.sha }} \
            ./frontend

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: statussphere-frontend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
        env:
          TRIVY_DISABLE_SBOM: "true"

      - name: Generate Trivy SARIF for frontend
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: statussphere-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
        env:
          TRIVY_DISABLE_SBOM: "true"

      - name: Upload frontend SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Push frontend image
        run: |
          docker tag statussphere-frontend:${{ github.sha }} \
            ghcr.io/shreeyasahai/status-sphere-platform-frontend:latest

          docker tag statussphere-frontend:${{ github.sha }} \
            ghcr.io/shreeyasahai/status-sphere-platform-frontend:${{ github.sha }}

          docker push ghcr.io/shreeyasahai/status-sphere-platform-frontend:latest
          docker push ghcr.io/shreeyasahai/status-sphere-platform-frontend:${{ github.sha }}