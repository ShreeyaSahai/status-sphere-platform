name: Docker

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-and-push:
    name: Build, Scan and Push Docker Images
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------
      # Backend
      # -------------------------

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          provenance: false
          sbom: false
          tags: statussphere-backend:${{ github.sha }}

      - name: Debug - inspect backend image packages
        if: always()
        run: |
          docker run --rm --entrypoint sh statussphere-backend:${{ github.sha }} -c \
            "echo '--- pip show setuptools ---'; pip show setuptools; \
             echo '--- pip show msgpack ---'; pip show msgpack; \
             echo '--- filesystem search ---'; \
             find / \( -iname '*setuptools*' -o -iname '*msgpack*' \) -not -path '/proc/*' 2>/dev/null"

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: statussphere-backend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generate Trivy SARIF for backend
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: statussphere-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload backend SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Push backend image
        run: |
          docker tag statussphere-backend:${{ github.sha }} \
            ghcr.io/shreeyasahai/status-sphere-platform-backend:latest

          docker tag statussphere-backend:${{ github.sha }} \
            ghcr.io/shreeyasahai/status-sphere-platform-backend:${{ github.sha }}

          docker push ghcr.io/shreeyasahai/status-sphere-platform-backend:latest
          docker push ghcr.io/shreeyasahai/status-sphere-platform-backend:${{ github.sha }}

      # -------------------------
      # Frontend
      # -------------------------

      - name: Build frontend image
        if: always()
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          provenance: false
          sbom: false
          tags: statussphere-frontend:${{ github.sha }}

      - name: Scan frontend image with Trivy
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: statussphere-frontend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generate Trivy SARIF for frontend
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: statussphere-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload frontend SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Push frontend image
        run: |
          docker tag statussphere-frontend:${{ github.sha }} \
            ghcr.io/shreeyasahai/status-sphere-platform-frontend:latest

          docker tag statussphere-frontend:${{ github.sha }} \
            ghcr.io/shreeyasahai/status-sphere-platform-frontend:${{ github.sha }}

          docker push ghcr.io/shreeyasahai/status-sphere-platform-frontend:latest
          docker push ghcr.io/shreeyasahai/status-sphere-platform-frontend:${{ github.sha }}